<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - GawangIn</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 50%, #1a1a1a 100%);
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute; inset: 0;
      background: url('assets/lapangan2.jpeg') center/cover no-repeat;
      opacity: 0.15;
    }
    .login-card {
      position: relative; z-index: 10;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
      border-radius: 24px; padding: 3rem; width: 100%; max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.6s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card h1 { font-size: 2rem; font-weight: 700; color: #dc2626; text-align: center; }
    .login-card .subtitle { text-align: center; color: #666; margin-top: 0.5rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-weight: 500; color: #444; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-group .input-wrapper {
      position: relative;
    }
    .form-group .input-wrapper i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #aaa;
    }
    .form-group input {
      width: 100%; padding: 14px 14px 14px 42px; border: 2px solid #e5e7eb; border-radius: 12px;
      font-size: 1rem; font-family: 'Poppins', sans-serif; transition: all 0.3s ease;
    }
    .form-group input:focus { border-color: #dc2626; outline: none; box-shadow: 0 0 0 4px rgba(220,38,38,0.1); }
    .btn-login {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #dc2626, #b91c1c); color: white;
      font-size: 1rem; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(220,38,38,0.3);
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(220,38,38,0.4); }
    .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #888; font-size: 0.9rem; text-decoration: none; }
    .back-link:hover { color: #dc2626; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1><i class="fas fa-shield-halved"></i> Admin</h1>
    <p class="subtitle">Masuk untuk mengelola lapangan</p>
    <form class="mt-8" onsubmit="return false;">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="admin@gagangin.com" />
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Masukkan password" />
        </div>
      </div>
      <button type="button" onclick="validateLogin()" class="btn-login">
        <i class="fas fa-sign-in-alt mr-2"></i> Login
      </button>
    </form>
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left mr-1"></i> Kembali ke Beranda</a>
  </div>

  <script>
    function validateLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (email === 'GawangIn@gmail.com' && password === 'GawangIn123') {
        localStorage.setItem('isLoggedIn', 'true');
        alert('Login berhasil!');
        window.location.href = 'index.html';
      } else {
        alert('Email atau password salah!');
      }
    }
  </script>
</body>
</html>
