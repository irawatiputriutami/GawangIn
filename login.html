<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Futsal Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-red-100 min-h-screen flex justify-center items-center">
    <!-- Halaman Login -->
    <div id="login-page" class="w-full max-w-md p-6 bg-white rounded-2xl shadow-lg">
        <h1 class="text-center text-2xl font-bold text-red-600">Admin Login</h1>
        <form class="mt-6">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="w-full mt-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="Masukkan email">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="w-full mt-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="Masukkan password">
            </div>
            <button type="button" onclick="validateLogin()" class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition">Login</button>
        </form>
    </div>

    <script>
        // Validasi Kredensial Login dan Simpan Status Login
        function validateLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Memeriksa email dan password yang benar
            if (email === 'GawangIn@gmail.com' && password === 'GawangIn123') {
                // Simpan status login di localStorage (atau bisa menggunakan sessionStorage atau cookies)
                localStorage.setItem('isLoggedIn', 'true');
                alert('Login berhasil!');
                window.location.href = 'index.html'; // Arahkan ke halaman utama
            } else {
                alert('Email atau password salah!');
            }
        }
    </script>
</body>
</html>
