<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tambah Sewa Lapangan - GawangIn</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #fafafa; min-height: 100vh; display: flex; flex-direction: column; }

    .navbar {
      background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    .nav-brand { font-size: 1.5rem; font-weight: 800; color: #dc2626; }

    .page-header {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      padding: 3rem 2rem; text-align: center; color: white;
    }
    .page-header h1 { font-size: 2rem; font-weight: 700; }

    .form-container {
      flex: 1; max-width: 700px; width: 100%; margin: 2rem auto; padding: 3rem;
      background: white; border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label {
      display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; font-size: 0.9rem;
    }
    .form-group input,
    .form-group textarea {
      width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px;
      font-size: 1rem; font-family: 'Poppins', sans-serif; transition: all 0.3s ease;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #dc2626; outline: none; box-shadow: 0 0 0 4px rgba(220,38,38,0.1);
    }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .file-input-wrapper {
      border: 2px dashed #e5e7eb; border-radius: 12px; padding: 2rem; text-align: center;
      cursor: pointer; transition: all 0.3s ease; position: relative;
    }
    .file-input-wrapper:hover { border-color: #dc2626; background: #fef2f2; }
    .file-input-wrapper input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; border: none; padding: 0;
    }
    .file-input-wrapper i { font-size: 2rem; color: #dc2626; margin-bottom: 0.5rem; }
    .file-input-wrapper p { color: #888; font-size: 0.9rem; }

    .button-group { display: flex; gap: 1rem; margin-top: 2rem; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center;
      font-family: 'Poppins', sans-serif; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: all 0.3s ease;
    }
    .btn-red {
      background: linear-gradient(135deg, #dc2626, #b91c1c); color: white;
      box-shadow: 0 4px 15px rgba(220,38,38,0.3);
    }
    .btn-red:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(220,38,38,0.4); }
    .btn-gray { background: #f3f4f6; color: #555; }
    .btn-gray:hover { background: #e5e7eb; }

    .footer {
      background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
      color: white; padding: 2rem; text-align: center; margin-top: auto;
    }
    .footer p { color: #aaa; font-size: 0.85rem; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="nav-brand">GawangIn</a>
      <a href="pemesanan.html" class="text-gray-600 hover:text-red-600 transition font-medium">
        <i class="fas fa-arrow-left mr-1"></i> Katalog
      </a>
    </div>
  </nav>

  <!-- Header -->
  <header class="page-header">
    <h1><i class="fas fa-plus-circle mr-2"></i> Tambah Lapangan Baru</h1>
  </header>

  <!-- Form -->
  <div class="form-container">
    <form id="lapanganForm">
      <div class="form-group">
        <label for="nama"><i class="fas fa-tag mr-1 text-red-500"></i> Nama Lapangan</label>
        <input type="text" id="nama" name="nama" placeholder="Contoh: Lapangan Futsal A" required />
      </div>
      <div class="form-group">
        <label for="deskripsi"><i class="fas fa-align-left mr-1 text-red-500"></i> Deskripsi</label>
        <textarea id="deskripsi" name="deskripsi" placeholder="Deskripsikan fasilitas dan keunggulan lapangan..." required></textarea>
      </div>
      <div class="form-group">
        <label for="harga"><i class="fas fa-money-bill mr-1 text-red-500"></i> Harga Sewa (per jam)</label>
        <input type="number" id="harga" name="harga" placeholder="500000" required />
      </div>
      <div class="form-group">
        <label><i class="fas fa-image mr-1 text-red-500"></i> Foto Lapangan</label>
        <div class="file-input-wrapper">
          <input type="file" id="gambar" name="gambar" accept="image/*" required />
          <i class="fas fa-cloud-upload-alt"></i>
          <p>Klik atau drag foto ke sini</p>
        </div>
      </div>
      <div class="button-group">
        <a href="pemesanan.html" class="btn btn-gray"><i class="fas fa-times"></i> Batal</a>
        <button type="submit" class="btn btn-red"><i class="fas fa-check"></i> Tambah Lapangan</button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 GawangIn &mdash; Platform Sewa Lapangan Online</p>
  </footer>

  <script>
    document.getElementById('lapanganForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const deskripsi = document.getElementById('deskripsi').value;
      const harga = document.getElementById('harga').value;
      const gambarInput = document.getElementById('gambar');
      if (gambarInput.files && gambarInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const newLapangan = { nama, deskripsi, harga, gambar: e.target.result };
          let katalog = JSON.parse(localStorage.getItem('katalogLapangan')) || [];
          katalog.push(newLapangan);
          localStorage.setItem('katalogLapangan', JSON.stringify(katalog));
          window.location.href = "pemesanan.html";
        };
        reader.readAsDataURL(gambarInput.files[0]);
      }
    });
  </script>
</body>
</html>
