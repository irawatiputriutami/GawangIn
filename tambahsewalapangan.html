<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tambah Sewa Lapangan - GawangIn</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="tambahsewalapangan.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-red-100">
  <!-- Header -->
  <header>
    <h1>Tambah Sewa Lapangan</h1>
  </header>
  
  <!-- Form Tambah Lapangan -->
  <div class="form-container">
    <form id="lapanganForm">
      <div class="form-group">
        <label for="nama">Nama Lapangan</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lapangan" required>
      </div>
      <div class="form-group">
        <label for="deskripsi">Deskripsi</label>
        <textarea id="deskripsi" name="deskripsi" placeholder="Masukkan deskripsi lapangan" required></textarea>
      </div>
      <div class="form-group">
        <label for="harga">Harga Sewa (per jam)</label>
        <input type="number" id="harga" name="harga" placeholder="Masukkan harga sewa" required>
      </div>
      <div class="form-group">
        <label for="gambar">Upload Gambar</label>
        <input type="file" id="gambar" name="gambar" accept="image/*" required>
      </div>
      <div class="button-group">
        <a href="pemesanan.html" class="btn btn-gray">Batal</a>
        <button type="submit" class="btn btn-red">Tambah Lapangan</button>
      </div>
    </form>
  </div>
  
  <!-- Footer -->
  <footer>
    <div class="container-footer">
      <p>Lokasi: Jl. Raya Futsal No.123</p>
      <p>Telepon: +62 812 3456 7890</p>
      <p>WhatsApp: +62 812 3456 7890</p>
      <p>Instagram: @GawangIn</p>
    </div>
  </footer>
  
  <script>
    document.getElementById('lapanganForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nama = document.getElementById('nama').value;
      const deskripsi = document.getElementById('deskripsi').value;
      const harga = document.getElementById('harga').value;
      const gambarInput = document.getElementById('gambar');
      
      if (gambarInput.files && gambarInput.files[0]) {
        const file = gambarInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          const gambarData = e.target.result; // Data URL gambar
          const newLapangan = { nama, deskripsi, harga, gambar: gambarData };
          
          let katalog = JSON.parse(localStorage.getItem('katalogLapangan')) || [];
          katalog.push(newLapangan);
          localStorage.setItem('katalogLapangan', JSON.stringify(katalog));
          
          window.location.href = "pemesanan.html";
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
